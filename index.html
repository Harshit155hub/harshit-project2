<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lightbulb Pull Toggle</title>
  <link rel="stylesheet" href="the_coding_wizard.css" />
</head>
<body>
  <div class="toggle-scene">
    <svg id="bulb-svg" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
      <circle id="bulb" cx="50" cy="40" r="30" fill="#e8ff8b" stroke="#222" stroke-width="4"/>
      <rect x="40" y="70" width="20" height="20" fill="silver" />
      <line x1="50" y1="90" x2="50" y2="150" stroke="black" stroke-width="2"/>
      <circle id="switch" cx="50" cy="155" r="5" fill="silver" style="cursor: pointer;"/>
    </svg>
  </div>
  <script src="script.js"></script>
</body>
</html>
